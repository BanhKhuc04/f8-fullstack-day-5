<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./css/style.css" />
        <title>Register</title>
    </head>
    <body>
        <div class="form">
            <h1>Register</h1>
            <label>
                <p>Display Name</p>
                <input
                    type="text"
                    spellcheck="false"
                    autocomplete="off"
                    placeholder="Display Name ..."
                />
            </label>
            <label>
                <p>Email</p>
                <input
                    type="email"
                    spellcheck="false"
                    autocomplete="off"
                    placeholder="Email ..."
                />
            </label>
            <label>
                <p>Phone Number</p>
                <input
                    type="number"
                    spellcheck="false"
                    autocomplete="off"
                    placeholder="Phone Number ..."
                />
            </label>
            <label>
                <p>Password</p>
                <input
                    type="password"
                    spellcheck="false"
                    autocomplete="off"
                    placeholder="Password..."
                />
            </label>
            <label>
                <p>Confirm Password</p>
                <input
                    type="password"
                    spellcheck="false"
                    autocomplete="off"
                    placeholder="Confirm Password ..."
                />
            </label>
            <span>
                <p>Gender</p>
                <label> <input type="radio" name="gender" checked />Nam</label>
                <label> <input type="radio" name="gender" />Nữ</label>
                <label> <input type="radio" name="gender" />Khác</label>
            </span>
            <label>
                <p>Date of Birth</p>
                <input type="date" spellcheck="false" autocomplete="off" />
            </label>
            <label>
                <p>Address</p>
                <input
                    type="text"
                    spellcheck="false"
                    autocomplete="off"
                    placeholder="Address..."
                />
            </label>
            <label>
                <p>Profile Picture (Avatar)</p>
                <img class="avatar-img" src="./img/img-avtar.png" alt="" />
                <input type="file" hidden accept="image/*" />
            </label>
            <span>
                <p>Communication Preferences</p>
                <div>
                    <label>
                        <input type="checkbox" name="Pre" />
                        Subscribe to Newsletter (Nhận bản tin định kỳ)
                    </label>
                </div>
                <div>
                    <label>
                        <input type="checkbox" name="Pre" />
                        Receive Promotional Emails (Nhận thông tin khuyến mãi)
                    </label>
                </div>
                <div>
                    <label>
                        <input type="checkbox" name="Pre" />
                        Get Product Updates (Nhận cập nhật sản phẩm mới)
                    </label>
                </div>
            </span>
            <div><button>Register</button></div>
        </div>
    </body>
</html>
